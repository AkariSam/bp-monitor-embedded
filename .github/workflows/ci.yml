name: CI

on:
  push:
    branches:
      - main
      - dev
      - "dev-*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r algo/requirements.txt
      - name: Generate simulation data
        run: python algo/scripts/gen_data.py --all --seeds 1
      - name: Run tests
        run: python -m pytest firmware/tests algo/tests -q
      - name: Run demos
        run: |
          python firmware/demo/run_demo.py
          python firmware/demo/run_algo_demo.py

  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public tree
        run: python tools/check_public_tree.py
